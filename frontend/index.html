<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Safety Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    :root {
      --bg: #0f172a;
      --panel: rgba(15, 23, 42, 0.82);
      --panel-border: rgba(148, 163, 184, 0.25);
      --accent: #38bdf8;
      --safe: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #e2e8f0;
      --muted: #cbd5e1;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    #map {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .panel {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 500;
      width: min(360px, calc(100% - 32px));
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 18px 18px 14px;
      backdrop-filter: blur(8px);
      box-shadow: 0 20px 35px rgba(15, 23, 42, 0.35);
    }

    h1 {
      margin: 0 0 8px;
      font-size: 1.6rem;
    }

    .meta {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .status-box {
      background: rgba(15, 118, 110, 0.15);
      border: 1px solid rgba(94, 234, 212, 0.25);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      color: var(--text);
    }

    .status-box.danger {
      background: rgba(127, 29, 29, 0.2);
      border-color: rgba(248, 113, 113, 0.35);
    }

    .status-box.safe {
      background: rgba(20, 83, 45, 0.2);
      border-color: rgba(74, 222, 128, 0.35);
    }

    .status-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      opacity: 0.8;
      margin-bottom: 6px;
    }

    .status-value {
      font-size: 1.15rem;
      font-weight: 700;
    }

    .alert {
      font-size: 0.95rem;
      margin-top: 8px;
      color: #fef3c7;
    }

    button {
      border: none;
      background: linear-gradient(135deg, var(--accent), #2563eb);
      color: #fff;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.95rem;
      cursor: pointer;
      width: 100%;
      font-weight: 700;
    }

    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      background: #0f172a;
      color: #e2e8f0;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="panel">
    <h1>Safety Map</h1>
    <p class="meta">Live risk monitoring for your area</p>

    <div id="statusBox" class="status-box safe">
      <div class="status-title">Current Status</div>
      <div id="statusText" class="status-value">Checking your location…</div>
      <div id="alertText" class="alert">Please allow location access to get personalized alerts.</div>
    </div>

    <button id="reportBtn" type="button">Report an unsafe spot</button>
  </div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([12.9716, 77.5946], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const unsafeZones = [
      { name: 'Bannerghatta Road', lat: 12.8917, lng: 77.5847, reason: 'High theft incidents reported at night.' },
      { name: 'Begur Road', lat: 12.8675, lng: 77.6162, reason: 'Poor street lighting and isolated stretches.' },
      { name: 'HSR Layout', lat: 12.9144, lng: 77.6511, reason: 'Frequent vehicle break-ins near transit points.' },
      { name: 'Kormangala', lat: 12.9352, lng: 77.6245, reason: 'Crowded areas with occasional pickpocket reports.' }
    ];

    unsafeZones.forEach(zone => {
      const marker = L.circleMarker([zone.lat, zone.lng], {
        radius: 12,
        color: '#ef4444',
        fillColor: '#ef4444',
        fillOpacity: 0.7
      }).addTo(map);

      marker.bindPopup(`<strong>${zone.name}</strong><br>${zone.reason}`);
    });

    const statusBox = document.getElementById('statusBox');
    const statusText = document.getElementById('statusText');
    const alertText = document.getElementById('alertText');

    function toRadians(value) {
      return value * Math.PI / 180;
    }

    function distanceBetween(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = toRadians(lat2 - lat1);
      const dLon = toRadians(lon2 - lon1);
      const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(toRadians(lat1)) * Math.cos(toRadians(lat2)) *
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function updateStatus(isSafe, message) {
      statusBox.classList.toggle('safe', isSafe);
      statusBox.classList.toggle('danger', !isSafe);
      statusText.textContent = isSafe ? 'You are in a safe zone' : 'Unsafe zone detected';
      alertText.textContent = message;
    }

    function markUserLocation(lat, lng) {
      const userMarker = L.circleMarker([lat, lng], {
        radius: 10,
        color: '#38bdf8',
        fillColor: '#38bdf8',
        fillOpacity: 0.9
      }).addTo(map);

      userMarker.bindPopup('Your current location');
      map.setView([lat, lng], 14);

      let nearestZone = null;
      let shortestDistance = Number.MAX_VALUE;

      unsafeZones.forEach(zone => {
        const dist = distanceBetween(lat, lng, zone.lat, zone.lng);
        if (dist < shortestDistance) {
          shortestDistance = dist;
          nearestZone = zone;
        }
      });

      if (nearestZone && shortestDistance < 2) {
        updateStatus(false, `Warning: you are within ${shortestDistance.toFixed(1)} km of ${nearestZone.name}. ${nearestZone.reason}`);
      } else {
        updateStatus(true, 'No nearby unsafe areas detected. Your route looks safe for now.');
      }
    }

    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        position => {
          const latitude = position.coords.latitude;
          const longitude = position.coords.longitude;
          markUserLocation(latitude, longitude);
        },
        () => {
          updateStatus(true, 'Location access was blocked, so the map is showing the default city view.');
        },
        { enableHighAccuracy: true, timeout: 10000 }
      );
    } else {
      updateStatus(true, 'Your browser does not support geolocation, so the map is using the default view.');
    }

    document.getElementById('reportBtn').addEventListener('click', () => {
      const lat = 12.9716;
      const lng = 77.5946;
      const popup = L.popup().setLatLng([lat, lng]).setContent('Unsafe area reported. Local review requested.');
      popup.openOn(map);
    });
  </script>
</body>
</html>
